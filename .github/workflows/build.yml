name: Build Executables

on:
    push:
      branches: [ deploy_test ]
    pull_request:
      branches: [ deploy_test ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pyinstaller
    - name: Build Frontend
      env:
        REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        CI: false
      run: |
        cd frontend
        npm ci
        npm run build
    - name: Build with PyInstaller
      run: |
        cd backend
        pyinstaller hypixel_forge.spec
    - name: Upload Linux Executable
      uses: actions/upload-artifact@v4
      with:
        name: hypixel-forge-linux
        path: backend/dist/hypixel_dwarven_forge-v1.1.2-linux
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pyinstaller
    - name: Build Frontend
      env:
        REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        CI: false
      run: |
        cd frontend
        npm ci
        npm run build
    - name: Build with PyInstaller
      run: |
        cd backend
        pyinstaller hypixel_forge.spec
    - name: Upload macOS Executable
      uses: actions/upload-artifact@v4
      with:
        name: hypixel-forge-macos
        path: backend/dist/hypixel_dwarven_forge-v1.1.2-macos
        retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pyinstaller
    - name: Build Frontend
      env:
        REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        CI: false
      run: |
        cd frontend
        npm ci
        npm run build
    - name: Build with PyInstaller
      run: |
        cd backend
        pyinstaller hypixel_forge.spec
    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: hypixel-forge-windows
        path: backend/dist/hypixel_dwarven_forge-v1.1.2-win.exe
        retention-days: 7